# Skills Catalog — Machine-readable index for the super-agent orchestrator.
# Human-readable docs live in README.md. This file is the routing source of truth.
#
# Fields:
#   id:           Unique identifier (matches filename without .md)
#   name:         Short display name for plans
#   file:         Path to the skill SOP
#   category:     "personal" or "coworker"
#   description:  One-line summary of what the skill does
#   commands:     List of commands the skill accepts
#   triggers:     Keywords/phrases that suggest this skill is relevant
#   requires_config: Whether .local/skills-config.yaml is needed
#   companions:   Other files the skill depends on (style guides, topic configs)
#   data_dir:     Where the skill reads/writes data
#   latest:       true if this is the current version (false for superseded versions)

skills:
  - id: coworker-tpm
    name: "TPM"
    file: skills/coworker-tpm.md
    category: coworker
    description: "Project management — status reports, daily plans, Asana ticket updates, drift detection across workstreams"
    commands:
      - "/review-project"
      - "/plan-today"
      - "/update-asana"
      - "/detail-ticket [ID]"
      - "/status [SLUG]"
      - "/status-all"
      - "/weekly-status [SLUG]"
      - "/weekly-status-all"
      - "/progress-report [SLUG]"
      - "/refresh"
    triggers:
      - "project status"
      - "status"
      - "what's blocked"
      - "daily plan"
      - "asana"
      - "ticket"
      - "sprint"
      - "workstream"
      - "progress report"
      - "weekly status"
      - "what changed this week"
      - "at risk"
      - "escalation"
      - "overdue"
    requires_config: true
    data_dir: ".local/data/tpm/"

