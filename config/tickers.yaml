# Stock Research — Ticker Configuration
#
# Two sections:
#   tickers: Per-ticker config with named peers and subreddits (for deep research)
#   sectors: Sector-to-ticker mapping (for screening, grouping, sector rotation)
#
# Ported from: .local/data/options-pnl/sector-map.json (~120 tickers, 30 sectors)
# Merged with: agent-investor/config.yaml segments

# ─── Per-Ticker Research Config ─────────────────────────────────────────
# Used by /research-stock and /compare-stocks for peer comparison.
# Each ticker lists economically comparable peers (not just same-industry).

tickers:
  NVDA:
    name: "NVIDIA Corporation"
    sector: CHIPS
    peers:
      - AMD    # Direct GPU competitor, similar AI exposure
      - AVGO   # Broadcom — AI/datacenter semiconductor, similar margin profile
      - INTC   # Intel — CPU/GPU competitor, contrasting trajectory
      - QCOM   # Qualcomm — AI edge compute, different end-market mix
      - TSM    # TSMC — foundry partner, upstream supply chain
    subreddits: [wallstreetbets, stocks, investing, nvidia]

  AAPL:
    name: "Apple Inc."
    sector: MAG7
    peers:
      - MSFT   # Enterprise + consumer platform, similar scale
      - GOOGL  # Advertising + devices + cloud, similar ecosystem breadth
      - AMZN   # Devices + services, different margin structure
    subreddits: [wallstreetbets, stocks, investing, apple]

  MSFT:
    name: "Microsoft Corporation"
    sector: MAG7
    peers: [AAPL, GOOGL, AMZN, META]
    subreddits: [wallstreetbets, stocks, investing]

  GOOGL:
    name: "Alphabet Inc."
    sector: MAG7
    peers: [META, MSFT, AMZN, AAPL]
    subreddits: [wallstreetbets, stocks, investing]

  META:
    name: "Meta Platforms"
    sector: MAG7
    peers: [GOOGL, SNAP, PINS, TTD]
    subreddits: [wallstreetbets, stocks, investing]

  TSLA:
    name: "Tesla Inc."
    sector: MAG7
    peers: [NIO, RIVN, F, GM, LCID]
    subreddits: [wallstreetbets, stocks, investing, teslainvestorsclub]

  AMD:
    name: "Advanced Micro Devices"
    sector: CHIPS
    peers: [NVDA, INTC, QCOM, AVGO, ARM]
    subreddits: [wallstreetbets, stocks, investing, AMD_Stock]

  PLTR:
    name: "Palantir Technologies"
    sector: TECH-SAAS
    peers: [SNOW, DDOG, CRM, NOW]
    subreddits: [wallstreetbets, stocks, investing, PLTR]

  SMCI:
    name: "Super Micro Computer"
    sector: CHIPS
    peers: [DELL, HPE, NVDA, AMD]
    subreddits: [wallstreetbets, stocks, investing]

